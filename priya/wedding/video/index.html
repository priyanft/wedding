<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invitation Video Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;500&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #111; color: #eee; font: 14px "Montserrat", system-ui, sans-serif;
           display: grid; grid-template-columns: 1fr 300px; height: 100vh; }
    .stage { display: grid; place-items: center; padding: 16px; min-height: 0; }
    canvas { max-width: 100%; max-height: calc(100vh - 32px); box-shadow: 0 20px 60px #000; background: #000; }
    aside { background: #1b1b1b; padding: 20px; display: flex; flex-direction: column; gap: 12px; overflow: auto; }
    h1 { font: 400 1.6rem "Great Vibes", cursive; color: #f0d79c; margin: 0 0 8px; }
    button, select { font: inherit; width: 100%; padding: 10px; border: 1px solid #c9a35b; background: transparent; color: #f0d79c; cursor: pointer; }
    button.primary { background: #c9a35b; color: #111; }
    button:disabled { opacity: .4; cursor: wait; }
    input[type=range] { width: 100%; accent-color: #c9a35b; }
    .muted { color: #999; font-size: 12px; line-height: 1.6; }
    #status { color: #f0d79c; min-height: 1.4em; }
    @media (max-width: 800px) { body { grid-template-columns: 1fr; height: auto; } }
  </style>
</head>
<body>
  <div class="stage"><canvas id="cv"></canvas></div>
  <aside>
    <h1>Video Studio</h1>
    <label>Format
      <select id="format">
        <option value="1080x1920">Vertical 9:16 (Reels, WhatsApp Status)</option>
        <option value="1920x1080">Landscape 16:9 (YouTube, TV)</option>
        <option value="1080x1080">Square 1:1</option>
      </select>
    </label>
    <button id="play">▶ Preview</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline" />
    <div class="muted" id="time">0.0s</div>
    <button id="export" class="primary">● Record &amp; Download Video</button>
    <div id="status"></div>
    <p class="muted">
      Recording runs in real time, so keep this tab open and in front until it finishes.
      Chrome saves MP4 when it can and WebM otherwise. Edit <b>config.js</b> to change the text, photos and music.
      Any shot in <b>video.shots</b> can be an AI-animated .mp4 clip in place of a photo.
    </p>
  </aside>
  <script src="../config.js"></script>
  <script src="../shared/placeholder.js"></script>
  <script src="studio.js"></script>
</body>
</html>
